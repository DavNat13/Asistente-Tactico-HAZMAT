# =============================================================================
# CI — Asistente HAZMAT (lint, tests, seguridad, contenedor)
# =============================================================================
name: "CI — Integración Continua"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # menor privilegio

env:
  PYTHON_VERSION: "3.12"
  FORCE_COLOR: "1"

jobs:
  calidad:
    name: "Lint, formato y estructura"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Instalar herramientas"
        run: pip install ruff==0.16.7
      - name: "Ruff (lint + formato)"
        run: |
          ruff check . --output-format=github
          ruff format --check .
      - name: "Límite de 150 líneas por archivo"
        run: |
          over=$(find src evals tests app.py -name "*.py" -exec wc -l {} + | awk '$2 != "total" && $1 > 150')
          if [ -n "$over" ]; then echo "::error::Archivos sobre 150 líneas:"; echo "$over"; exit 1; fi

  pruebas:
    name: "Pruebas unitarias"
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-heavy.txt
            requirements-dev.txt
      - name: "Instalar dependencias"
        run: |
          pip install -r requirements-heavy.txt -r requirements.txt -r requirements-dev.txt
      - name: "Pytest con cobertura"
        run: |
          pytest tests src --cov=src --cov-report=xml --cov-report=term-missing \
            --junitxml=junit-results.xml --timeout=120 -v
        env:
          PYTHONPATH: ${{ github.workspace }}
          GEMINI_API_KEYS: "test-dummy-key"
          MONGODB_URI: "mongodb://localhost:27017/test"
          GUARDRAIL_LLM: "false"
          LANGCHAIN_TRACING_V2: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage.xml
            junit-results.xml
          retention-days: 14

  seguridad:
    name: "Seguridad (SAST + dependencias + secretos)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Instalar herramientas"
        run: pip install bandit==1.8.3 pip-audit==2.9.0
      - name: "Bandit — bloquea hallazgos de severidad ALTA"
        run: |
          bandit -r src -f json -o bandit-report.json || true
          bandit -r src -lll
      - name: "pip-audit — vulnerabilidades conocidas (CVE)"
        run: |
          pip-audit -r requirements.txt --format json --output pip-audit.json || true
          pip-audit -r requirements.txt
      - name: "Gitleaks — secretos en el historial"
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit.json
          retention-days: 14

  contenedor:
    name: "Dockerfile y compose"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: "Validar docker-compose.yml"
        run: docker compose config --quiet
