# Evaluación nocturna: corre el set de evaluación (31 casos + casos aprobados desde el feedback),
# guarda el resultado en MongoDB (eval_runs) y avisa por correo si la calidad baja.
name: "Evaluación nocturna"

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC ≈ 03:00 en Chile
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-heavy.txt
      - name: "Instalar dependencias"
        run: pip install -r requirements-heavy.txt -r requirements.txt
      - name: "Evaluar y detectar regresiones"
        run: python -m src.automation.jobs nightly-eval
        env:
          PYTHONPATH: ${{ github.workspace }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_COLLECTION_NAME: gre_chunks_v5
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          LANGCHAIN_TRACING_V2: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
          retention-days: 30
