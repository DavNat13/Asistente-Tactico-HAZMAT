<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Asistente HAZMAT</title>
  <desc id="d">Agente RAG para emergencias con materiales peligrosos. Bomberos de Chile, GRE 2024.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d0710"/>
      <stop offset=".45" stop-color="#8f0c22"/>
      <stop offset="1" stop-color="#d8343a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".7">
      <stop offset="0" stop-color="#ffb47a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffb47a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1.2" height="22" fill="#fff" fill-opacity=".07"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="340" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#stripes)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <!-- Rombo de materiales peligrosos (motivo de marca) -->
    <g transform="translate(1085 170) rotate(45)" fill="none" stroke="#fff" stroke-opacity=".16">
      <rect x="-118" y="-118" width="236" height="236" rx="18" stroke-width="3"/>
      <rect x="-86" y="-86" width="172" height="172" rx="12" stroke-width="2"/>
    </g>
    <!-- Marca -->
    <rect x="72" y="70" width="76" height="76" rx="22" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".3"/>
    <g transform="translate(88 86) scale(1.85)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
    </g>
    <text x="72" y="208" fill="#fff" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">Asistente HAZMAT</text>
    <text x="74" y="250" fill="#fff" fill-opacity=".86" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500">Decisiones más seguras ante materiales peligrosos · GRE 2024 · Manual ABC-V</text>
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#fff">
      <rect x="74" y="276" width="158" height="32" rx="16" fill="#fff" fill-opacity=".14"/>
      <text x="153" y="297" text-anchor="middle">AGENTE RAG</text>
      <rect x="244" y="276" width="178" height="32" rx="16" fill="#fff" fill-opacity=".14"/>
      <text x="333" y="297" text-anchor="middle">CITA LA PÁGINA</text>
      <rect x="434" y="276" width="214" height="32" rx="16" fill="#fff" fill-opacity=".14"/>
      <text x="541" y="297" text-anchor="middle">BOMBEROS DE CHILE</text>
    </g>
  </g>
</svg>
